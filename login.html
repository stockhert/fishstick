<div class="loginContainer active" id="login">
  <h1>log in</h1>
  <form id="loginForm">
    <input type="text" placeholder="username" id="loginUsername">
    <div>or:</div>
    <input type="text" placeholder="email" id="loginEmail">
    <input type="password" placeholder="password" id="loginPassword">
    <button type="submit">login</button>
  </form>
  <p>don't have an account?</p>
  <a class="hoverEffect" href="#" style="font-weight: 900" onclick="showByID('signup', '.loginContainer')">sign up</a>
</div>
<div class="loginContainer" id="signup">
  <h1>sign up</h1>
  <form id="signupForm">
    <input type="text" placeholder="username" id="signupUsername">
    <input type="text" placeholder="email" id="signupEmail">
    <input type="password" placeholder="password" id="signupPassword">
    <input type="password" placeholder="repeat password" id="signupRepeatPassword">
    <button type="submit">signup</button>
  </form>
  <p>already have an account?</p>
  <a class="hoverEffect" href="#" style="font-weight: 900" onclick="showByID('login', '.loginContainer')">log in</a>
</div>
<div id="message" style="color: red; margin-top: 10px;"></div>

<script src="src/ts/script.js"></script>
<script type="module" src="src/ts/loginController.js"></script>


</body>
